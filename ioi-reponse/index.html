<style>
:root{--bg:#fafaf7;--panel:#fff;--text:#1d1d1b;--muted:#6b6b66;--line:#e3e2dc;--accent:#2f6fed;--accent-bg:#e8effd;--code-bg:#f4f3ee;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16171a;--panel:#1e2024;--text:#ecebe6;--muted:#9a9a94;--line:#33353a;--accent:#7aa2ff;--accent-bg:#26324f;--code-bg:#15161a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16171a;--panel:#1e2024;--text:#ecebe6;--muted:#9a9a94;--line:#33353a;--accent:#7aa2ff;--accent-bg:#26324f;--code-bg:#15161a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{padding:12px 14px 8px;border-bottom:1px solid var(--line);background:var(--panel)}
h1{font-size:16px;margin:0 0 8px;font-weight:600}
h1 small{font-weight:400;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#q{flex:1;min-width:180px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}
#q:focus{outline:2px solid var(--accent);outline-offset:-1px}
label.opt{font-size:13px;color:var(--muted);display:flex;gap:5px;align-items:center;white-space:nowrap}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:999px;padding:4px 11px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(260px,360px) 1fr}
#list{overflow-y:auto;border-right:1px solid var(--line);background:var(--panel)}
#view{overflow:auto;padding:14px;display:flex;flex-direction:column;min-width:0}
.grp{position:sticky;top:0;background:var(--panel);font-size:12px;font-weight:600;color:var(--muted);padding:8px 14px 4px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.03em}
.item{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--text);padding:8px 14px;font:inherit;cursor:pointer}
.item:hover{background:var(--bg)}
.item[aria-current="true"]{background:var(--accent-bg)}
.item .n{color:var(--muted);font-size:12px;margin-right:6px}
.item .v{font-size:11px;color:var(--accent);margin-left:6px}
.empty{padding:24px 14px;color:var(--muted)}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.bar h2{font-size:17px;margin:0;flex:1;min-width:160px}
.meta{color:var(--muted);font-size:13px;margin:0 0 10px}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer}
.btn.alt{background:transparent;color:var(--accent)}
.btn.ok{background:#1f8f4e;border-color:#1f8f4e}
.code{display:flex;background:var(--code-bg);border:1px solid var(--line);border-radius:10px;overflow:auto;flex:1;min-height:120px}
.code pre{margin:0;padding:12px 0;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;tab-size:4}
#gut{color:var(--muted);text-align:right;padding:12px 10px;user-select:none;border-right:1px solid var(--line);position:sticky;left:0;background:var(--code-bg)}
#code{padding:12px 14px;white-space:pre}
.hint{color:var(--muted);font-size:13px;margin-top:8px}
@media (max-width:780px){
 main{grid-template-columns:1fr;grid-template-rows:42% 1fr}
 #list{border-right:0;border-bottom:1px solid var(--line)}
}
</style>
</head>

list(map(int, input().split()))\n    nbEclair = int(input())\n    eclair = list(map(int, input().split()))\n    foretFeu = [0] * nbCase\n    for i in range(nbEclair):\n        pos = eclair[i]\n        foretFeu[pos] = 1\n        altitude = foret[pos]\n        index = 1\n        while pos+index < nbCase and foret[pos + index] >= altitude and foretFeu[pos+index] == 0:\n            foretFeu[pos+index] = 1\n            altitude = foret[pos+index]\n            index += 1\n        index = 1\n        altitude = foret[pos]\n        while pos-index >= 0 and foret[pos-index] >= altitude and foretFeu[pos-index] == 0:\n            foretFeu[pos-index] = 1\n            altitude = foret[pos-index]\n            index += 1\n    print(sum(foretFeu))\n\n\nmain()\n","u":"https://github.com/SlicedPotatoes/France_IOI/blob/main/Concours/Algor%C3%A9a/2013/Tour%201/4%20-%20Challenge%204%20-%20Incendies%20de%20montagne.py","i":3},{"top":"Concours","ch":"Algoréa / 2013 / Tour 1","n":5,"t":"Challenge 5 - Dernier niveau","v":"","c":"def main():\n    nbBonus = int(input())\n    arr = list(map(int, input().split()))\n    bonus = [[],[],[],[],[]]\n    for i in range(nbBonus):\n        bonus[arr[i] - 1].append(i)\n    for i in range(5):\n        bonus[i].reverse()\n    tour = 0\n    end = False\n    while not(end):\n        lastMin = nbBonus\n        for i in range(4, -1, -1):\n            while len(bonus[i]) > 0 and bonus[i][0] > lastMin:\n                bonus[i].remove(bonus[i][0])\n            if(len(bonus[i]) > 0):\n                lastMin = bonus[i][0]\n                bonus[i].remove(bonus[i][0])\n            else:\n                end = True\n        if not end:\n            tour+=1\n    print(tour)\nmain()","u":"https://github.com/SlicedPotatoes/France_IOI/blob/main/Concours/Algor%C3%A9a/2013/Tour%201/5%20-%20Challenge%205%20-%20Dernier%20niveau.py","i":4},{"top":"Concours","ch":"Algoréa / 2013 / Tour 2","n":1,"t":"Challenge 1 - Entrée du temple","v":"","c":"from robot import *\nattends(1)\ Statues.py","i":8},{"top":"Mathématiques","ch":"1 – Nombres à virgule","n":1,"t":"Origami","v":"","c":"e_initiale = 0.110 / 10\nnb_plis = 15\ne_finale = e_initiale * 2 ** nb_plis\nprint(e_finale)","u":"https://github.com/SlicedPotatoes/France_IOI/blob/main/Math%C3%A9matiques/1%20%E2%80%93%20Nombres%20%C3%A0%20virgule/1%20-%20Origami.py","i":9},{"top":"Mathématiques","ch":"1 – Nombres à virgule","n":2,"t":"Conversions de distances","v":"","c":"lieues = float(input())\nprint(lieues / 0.707)","u":"https://github.com/SlicedPotatoes/France_IOI/blob/main/Math%C3%A9matiques/1%20%E2%80%93%20Nombres%20%C3%A0%20virgule/2%20-%20Conversions%20de%20distances.py","i":10},{"top":"Mathématiques","ch":"1 – Nombres à virgule","n":3,"t":"Comparatif de prix","v":"","c":"nbLegume = int(input())\nfor i in range(nbLegume):\n    poids = float(input())\n    age = float(input())\n    prix = float(input())\n    print(prix / poids)","u":"https://github.com/SlicedPotatoes/France_IOI/blob/main/Math%C3%A9matiques/1%20%E2%80%93%20Nombres%20%C3%A0%20virgule/3%20-%20Comparatif%20de%20prix.py","i":11},{"top":"Mathématiques","ch":"1 – Nombres à virgule","n":4,"t":"Moyenne des notes","v":"","c":"nbNote = int(input())\nsomme = 0\nfor i in range(nbNote):\n    somme += int(input())\nprint(somme/nbNote)","u":"https://github.com/SlicedPotatoes/France_IOI/blob/main/Math%C3%A9matiques/1%20%E2%80%93%20Nombres%20%C3%A0%20virgule/4%20-%20Moyenne%20des%20notes.py","i":12},{"top":"Mathématiques","ch":"1 – Nombres à virgule","n":5,"t":"Augmentation de la population","v":"","c":"from math import *\npopActuel = int(input())\ncroissance = float(input())\nprint(popActuel + floor(popActuel * croissance / 100))","u":"https://github.com/SlicedPotatoes/France_IOI/blob/main/Math%C3%A9matiques/1%20%E2%80%93%20Nombres%20%C3%A0%20virgule/5%20-%20Augmentation%20de%20la%20population.py","i":13},{"top":"Mathématiques","ch":"1 – Nombres à virgule","n":6,"t":"Construction de maisons","v":"","c":"from math import *\nquantiteCiment = float(input())\nprint(ceil(quantiteCiment / 60) * 45)","u":"https://github.com/SlicedPotatoes/France_IOI/blob/main/Math%C3%A9matiques/1%20%E2%80%93%20Nombres%20%C3%A0%20virgule/6%20-%20Construction%20de%20maisons.py","i":14},{"top":"Mathématiques","ch":"1 – Nombres à virgule","n":7,"t":"Soirée orageuse","v":"","c":"from math import *\nsec = float(input())\nprint(round(sec*340.29/1000))","u":"https://github.com/SlicedPotatoes/France_IOI/blob/main/Math%C3%A9matiques/1%20%E2%80%93%20Nombres%20%C3%A0%20virgule/7%20-%20Soir%C3%A9e%20orageuse.py","i":15},{"top":"Mathématiques","ch":"1 – Nombres à virgule","n":8,"t":"Augmentation des taxes","v":"","c":"from math import *\nvaleurTaxe = float(input())\nnewTaxe = float(input())\nprixActuel = float(input())\nprint(round((prixActuel/(1+(valeurTaxe/100)))*(1+(newTaxe/100)), 2))","u":"https://github.com/SlicedPotatoes/France_IOI/blob/main/Math%C3%A9matiques/1%20%E2%80%93%20Nombres%20%C3%A0%20virgule/8%20-%20Augmentation%20des%20taxes.py","i":16},{"top":"Mathématiques","ch":"2 – Quelques outils mathématiques","n":1,"t":"Nombre de tuiles","v":"","c":"from math import *\n\ndef hypotenuse(h, H, f):\n    AB = F/2\n    BC = H - h\n    return sqrt((AB ** 2) + (BC ** 2))\n\nF = float(input())\nL = float(input())\nH = float(input())\nh = float(input())\n\nprint((hypotenuse(h, H, F) * L) * 2)","u":"https://github.com/SlicedPotatoes/France_IOI/blob/main/Math%C3%A9matiques/2%20%E2%80%93%20Quelques%20outils%20math%C3%A9matiques/01%20-%20Nombre%20de%20tuiles.py","i":17},{"top":"Mathématiques","ch":"2 – Quelques outils mathématiques","n":2,"t":"Mise au carré","v":"","c":"from math import *\n\ni = int(input())\nif sqrt(i) == round(sqrt(i)):\n    print(\"Oui\")\nelse:\n    print(\"Non\")","u":"https://github.com/SlicedPotatoes/France_IOI/blob/main/Math%C3%A9matiques/2%20%E2%80%93%20Quelques%20outils%20math%C3%A9matiques/02%20-%20Mise%20au%20carr%C3%A9.py","i":18},{"top":"Mathématiques","ch":"2 – Quelques outils mathématiques","n":3,"t":"Pigeons
