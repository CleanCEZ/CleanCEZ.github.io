<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Clean’s projects on GitHub.">
  <title>Clean</title>
  <style>
    :root {
      --bg: #262624;
      --surface: rgba(48, 48, 46, 0.72);
      --surface-hover: rgba(53, 53, 51, 0.85);
      --border: #3f3f3c;
      --text: #faf9f5;
      --muted: #a8a69d;
      --accent: #d97757;
      --accent-hover: #e48a6c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .bg {
      position: fixed;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(ellipse at 50% 35%, rgba(250, 249, 245, 0.07), transparent 60%),
        linear-gradient(rgba(38, 38, 36, 0.55), rgba(38, 38, 36, 0.8)),
        url("background.jpg") center / cover no-repeat;
    }

    #leaves { position: fixed; inset: 0; z-index: -1; pointer-events: none; }

    a { color: inherit; }
    a:focus-visible, button:focus-visible { outline: 2px solid var(--accent-hover); outline-offset: 3px; }

    .page-layout {
      width: min(1100px, calc(100% - 48px));
      min-height: 100vh;
      margin: 0 auto;
      padding: 72px 0;
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(280px, 0.85fr);
      gap: clamp(32px, 7vw, 88px);
      align-items: center;
    }
    .hero {
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      backdrop-filter: blur(8px);
    }
    .projects-panel { min-width: 0; }
    @media (max-width: 720px) {
      .page-layout {
        grid-template-columns: 1fr;
        width: min(640px, calc(100% - 32px));
        padding: 76px 0 40px;
        gap: 28px;
      }
      .hero { grid-row: 1; }
      .projects-panel { grid-row: 2; }
    }

    .avatar {
      width: 112px;
      height: 112px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--surface);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 3rem;
      overflow: hidden;
    }

    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 400;
      font-size: clamp(2.2rem, 7vw, 3rem);
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin: 20px 0 6px;
      text-shadow: 0 0 18px rgba(250, 249, 245, 0.35);
    }
    .caret { color: var(--accent); animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .tagline { color: var(--muted); margin: 0 0 24px; }

    .card {
      display: flex;
      align-items: center;
      gap: 14px;
      text-align: left;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 12px 22px 12px 12px;
      backdrop-filter: blur(6px);
      margin-bottom: 24px;
    }
    .card .pic { position: relative; width: 56px; height: 56px; flex: none; }
    .card .pic img, .card .pic .fallback {
      width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
      background: var(--bg); display: grid; place-items: center;
      font-family: Georgia, serif; font-size: 1.4rem;
    }
    .card strong { display: block; font-weight: 600; line-height: 1.2; }
    .card span { color: var(--muted); font-size: 0.9rem; }

    .socials { display: flex; flex-wrap: wrap; justify-content: center; gap: 18px; padding: 0; margin: 0; list-style: none; }
    .socials a { display: block; color: var(--text); filter: drop-shadow(0 0 6px rgba(250, 249, 245, 0.45)); transition: color 0.15s, transform 0.15s; }
    .socials a:hover { color: var(--accent-hover); transform: translateY(-2px); }
    .socials svg { width: 30px; height: 30px; display: block; }
    .socials .stroke { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .socials .fill { fill: currentColor; }

    main { max-width: none; margin: 0; padding: 0; }
    h2 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: 1.5rem; margin: 0 0 16px; }
    #projects { display: grid; gap: 12px; padding: 0; margin: 0; list-style: none; }
    .project {
      display: block; background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 16px 20px; text-decoration: none;
      transition: background 0.15s, border-color 0.15s;
    }
    .project:hover { border-color: var(--accent); background: var(--surface-hover); }
    .project strong { display: block; font-weight: 600; }
    .project span { display: block; color: var(--muted); font-size: 0.95rem; margin-top: 2px; }
    .project small { display: block; color: var(--muted); font-size: 0.85rem; margin-top: 8px; }
    .status { color: var(--muted); }
  </style>
</head>
<body>
  <div class="bg"></div>
  <canvas id="leaves" aria-hidden="true"></canvas>

  <div class="page-layout">
    <main class="projects-panel">
      <h2>Projects</h2>
      <ul id="projects">
        <li>
          <a class="project" href="https://github.com/CleanCEZ/Gaming-Servives-Installer" target="_blank" rel="noopener">
            <strong>Gaming-Servives-Installer</strong>
            <span>GitHub project</span>
            <small>View repository ↗</small>
          </a>
        </li>
        <li>
          <a class="project" href="https://github.com/CleanCEZ/MultiBatch" target="_blank" rel="noopener">
            <strong>MultiBatch</strong>
            <span>GitHub project</span>
            <small>View repository ↗</small>
          </a>
        </li>
        <li>
          <a class="project" href="https://CleanCEZ.github.io/ioi-reponse/index.html" target="_blank" rel="noopener">
            <strong>IOI Response</strong>
            <span>Website</span>
            <small>Open website ↗</small>
          </a>
        </li>
      </ul>
    </main>

    <section class="hero">
      <img class="avatar" id="avatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 320 320'%3E%3Crect width='320' height='320' fill='%2389a0ad'/%3E%3Cpath d='M64 120C64 82 97 54 135 54H185C222 54 255 82 255 120V134C255 154 243 170 225 177L223 212H97L95 177C77 170 64 154 64 134V120Z' fill='%23251f1c'/%3E%3Cpath d='M79 122C91 95 120 76 160 76C200 76 229 95 241 122L226 137C214 124 192 114 160 114C128 114 106 124 94 137L79 122Z' fill='%231c1b1a'/%3E%3Cpath d='M96 145C110 186 136 209 160 209C184 209 210 186 224 145C216 127 191 116 160 116C129 116 104 127 96 145Z' fill='%23f1f0ee'/%3E%3Cpath d='M121 168C136 154 148 150 160 150C172 150 184 154 199 168L195 214H125L121 168Z' fill='%23d9d6d1'/%3E%3Cpath d='M117 212H203L223 256C172 282 148 282 97 256L117 212Z' fill='%23512e20'/%3E%3Cpath d='M138 212H182L168 258H152L138 212Z' fill='%23c9af8f'/%3E%3Cpath d='M97 256H223L218 278H102L97 256Z' fill='%234e2a1f'/%3E%3Cpath d='M117 212L160 246L203 212L189 196L160 214L131 196L117 212Z' fill='%23c8b097'/%3E%3Cpath d='M148 111C120 118 101 130 92 149C110 144 131 143 148 111Z' fill='%23f3f3f2'/%3E%3Cpath d='M172 111C200 118 219 130 228 149C210 144 189 143 172 111Z' fill='%23f3f3f2'/%3E%3Cpath d='M108 109C150 142 170 142 212 109C200 92 180 78 160 78C140 78 120 92 108 109Z' fill='%23f4f5f5'/%3E%3Cpath d='M89 230C114 216 139 210 160 210C181 210 206 216 231 230L214 278C198 286 177 291 160 291C143 291 122 286 106 278L89 230Z' fill='%2350302b'/%3E%3Cpath d='M74 241C91 255 116 275 160 282C204 275 229 255 246 241L228 267C204 278 182 285 160 285C138 285 116 278 92 267L74 241Z' fill='%23422d2c'/%3E%3Cpath d='M160 74L190 128C205 119 220 110 238 108L214 162L160 134L106 162L82 108C100 110 115 119 130 128L160 74Z' fill='%23f4f5f1'/%3E%3Cpath d='M145 128C136 108 117 92 95 90C98 119 112 137 145 128Z' fill='%23ffffff'/%3E%3Cpath d='M175 128C184 108 203 92 225 90C222 119 208 137 175 128Z' fill='%23ffffff'/%3E%3Cpath d='M136 106C109 91 83 90 64 111C90 122 119 128 136 106Z' fill='%23e7e7e4'/%3E%3Cpath d='M184 106C211 91 237 90 256 111C230 122 201 128 184 106Z' fill='%23e7e7e4'/%3E%3Cg fill='%23f0f0ef'%3E%3Cpath d='M128 86L105 131L144 109L128 86Z'/%3E%3Cpath d='M192 86L215 131L176 109L192 86Z'/%3E%3Cpath d='M160 96L198 134L160 141L122 134L160 96Z'/%3E%3C/g%3E%3C/svg%3E" alt="Skippy’s profile picture">

      <h1><span id="typed"></span><span class="caret">_</span></h1>
      <p class="tagline">My projects live on GitHub.</p>

      <div class="card">
        <div class="pic">
          <img id="cardPic" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 320 320'%3E%3Crect width='320' height='320' fill='%2389a0ad'/%3E%3Cpath d='M64 120C64 82 97 54 135 54H185C222 54 255 82 255 120V134C255 154 243 170 225 177L223 212H97L95 177C77 170 64 154 64 134V120Z' fill='%23251f1c'/%3E%3Cpath d='M79 122C91 95 120 76 160 76C200 76 229 95 241 122L226 137C214 124 192 114 160 114C128 114 106 124 94 137L79 122Z' fill='%231c1b1a'/%3E%3Cpath d='M96 145C110 186 136 209 160 209C184 209 210 186 224 145C216 127 191 116 160 116C129 116 104 127 96 145Z' fill='%23f1f0ee'/%3E%3Cpath d='M121 168C136 154 148 150 160 150C172 150 184 154 199 168L195 214H125L121 168Z' fill='%23d9d6d1'/%3E%3Cpath d='M117 212H203L223 256C172 282 148 282 97 256L117 212Z' fill='%23512e20'/%3E%3Cpath d='M138 212H182L168 258H152L138 212Z' fill='%23c9af8f'/%3E%3Cpath d='M97 256H223L218 278H102L97 256Z' fill='%234e2a1f'/%3E%3Cpath d='M117 212L160 246L203 212L189 196L160 214L131 196L117 212Z' fill='%23c8b097'/%3E%3Cpath d='M148 111C120 118 101 130 92 149C110 144 131 143 148 111Z' fill='%23f3f3f2'/%3E%3Cpath d='M172 111C200 118 219 130 228 149C210 144 189 143 172 111Z' fill='%23f3f3f2'/%3E%3Cpath d='M108 109C150 142 170 142 212 109C200 92 180 78 160 78C140 78 120 92 108 109Z' fill='%23f4f5f5'/%3E%3Cpath d='M89 230C114 216 139 210 160 210C181 210 206 216 231 230L214 278C198 286 177 291 160 291C143 291 122 286 106 278L89 230Z' fill='%2350302b'/%3E%3Cpath d='M74 241C91 255 116 275 160 282C204 275 229 255 246 241L228 267C204 278 182 285 160 285C138 285 116 278 92 267L74 241Z' fill='%23422d2c'/%3E%3Cpath d='M160 74L190 128C205 119 220 110 238 108L214 162L160 134L106 162L82 108C100 110 115 119 130 128L160 74Z' fill='%23f4f5f1'/%3E%3Cpath d='M145 128C136 108 117 92 95 90C98 119 112 137 145 128Z' fill='%23ffffff'/%3E%3Cpath d='M175 128C184 108 203 92 225 90C222 119 208 137 175 128Z' fill='%23ffffff'/%3E%3Cpath d='M136 106C109 91 83 90 64 111C90 122 119 128 136 106Z' fill='%23e7e7e4'/%3E%3Cpath d='M184 106C211 91 237 90 256 111C230 122 201 128 184 106Z' fill='%23e7e7e4'/%3E%3Cg fill='%23f0f0ef'%3E%3Cpath d='M128 86L105 131L144 109L128 86Z'/%3E%3Cpath d='M192 86L215 131L176 109L192 86Z'/%3E%3Cpath d='M160 96L198 134L160 141L122 134L160 96Z'/%3E%3C/g%3E%3C/svg%3E" alt="">
          </div>
        <div>
          <strong>Skippy</strong>
          <span id="activity">currently doing nothing</span>
        </div>
      </div>

      <ul class="socials" id="socials"></ul>
    </section>
  </div>

  <script>
    const NAME = "𝕊𝕜𝕚𝕡𝕡𝕪";
    const GITHUB_USER = "CleanCEZ";
    const STATUS_TEXT = "currently doing nothing";
    const DISCORD_ID = "";
    const LINKS = [
      { name: "GitHub", url: "https://github.com/CleanCEZ", icon: "github" },
      { name: "Discord server", url: "https://discord.gg/kbFYqP8Dr", icon: "discord" },
      { name: "Steam", url: "https://steamcommunity.com/profiles/76561199561603808/", icon: "link" },
    ];

    const ICONS = {
      github: '<svg viewBox="0 0 16 16" class="fill" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.15-.38-.72-.47-.72-.47-.36-.02-.44-.19-.44-.19-.12-.25.19-.24.19-.24.2.02.38.21.38.21.36.61.95.43.95.43.03-.26.14-.43.25-.53-1.6-.18-3.29-.8-3.29-3.56 0-.79.28-1.43.74-1.94-.07-.18-.32-.92.07-1.91 0 0 .6-.19 1.98.74A6.9 6.9 0 0 1 8 5.06c.61 0 1.23.08 1.81.24 1.38-.93 1.98-.74 1.98-.74.39.99.14 1.73.07 1.91.46.51.74 1.15.74 1.94 0 2.77-1.69 3.38-3.3 3.56.17.14.32.41.32.83 0 .6-.01 1.08-.01 1.23 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>',
      discord: '<svg viewBox="0 0 24 24" class="fill" aria-hidden="true"><path d="M19.7 5.1A18.3 18.3 0 0 0 15.2 3.7l-.6 1.2a16.8 16.8 0 0 0-5.2 0l-.6-1.2a18.3 18.3 0 0 0-4.5 1.4C1.5 9.3.7 13.4 1.1 17.4a18.5 18.5 0 0 0 5.6 2.8l1.2-2a11.8 11.8 0 0 1-1.9-.9l.5-.4a13.2 13.2 0 0 0 11 0l.5.4a11.8 11.8 0 0 1-1.9.9l1.2 2a18.5 18.5 0 0 0 5.6-2.8c.5-4.6-.8-8.6-3.2-12.3zM8.5 14.5c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2zm7 0c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2z"/></svg>',
      steam: '<svg viewBox="0 0 24 24" class="fill" aria-hidden="true"><path d="M12 2a10 10 0 0 0-9.9 11.4l5.4 2.2a3.2 3.2 0 0 0 5.9-1.7l3.1-2.3a4.2 4.2 0 1 0-1.2-1.7l-3.3 2.4a3.2 3.2 0 0 0-3.8 1.1l-4.1-1.7A8 8 0 1 1 12 20a7.9 7.9 0 0 1-6.8-3.8l-1.8-.7A10 10 0 1 0 12 2zm5.8 3.9a2.3 2.3 0 1 1 0 4.6 2.3 2.3 0 0 1 0-4.6zM9.2 15a1.8 1.8 0 1 1 0 3.6 1.8 1.8 0 0 1 0-3.6z"/></svg>',
      link: '<svg viewBox="0 0 24 24" class="stroke" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>'
    };

    const socials = document.getElementById("socials");
    for (const l of LINKS) {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.href = l.url;
      a.target = "_blank";
      a.rel = "noopener";
      a.setAttribute("aria-label", l.name);
      a.title = l.name;
      a.innerHTML = ICONS[l.icon] || ICONS.link;
      li.appendChild(a);
      socials.appendChild(li);
    }

    function letterFallback(img, cls) {
      img.addEventListener("error", () => {
        const d = document.createElement("div");
        d.className = cls;
        d.textContent = NAME[0];
        img.replaceWith(d);
      });
    }
    letterFallback(document.getElementById("avatar"), "avatar");
    letterFallback(document.getElementById("cardPic"), "fallback");

    const typed = document.getElementById("typed");
    const text = NAME;
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce) {
      typed.textContent = text;
    } else {
      let i = 0;
      (function type() {
        typed.textContent = text.slice(0, ++i);
        if (i < text.length) setTimeout(type, 140);
      })();
    }

    document.getElementById("activity").textContent = STATUS_TEXT;
    if (DISCORD_ID) {
      fetch(`https://api.lanyard.rest/v1/users/${DISCORD_ID}`)
        .then(r => r.json())
        .then(({ success, data }) => {
          if (!success) return;
          const acts = data.activities || [];
          const custom = acts.find(a => a.type === 4);
          const game = acts.find(a => a.type !== 4);
          const line = game ? game.name : (custom && custom.state) || STATUS_TEXT;
          document.getElementById("activity").textContent = line;
        })
        .catch(() => {});
    }

    if (!reduce) {
      const cv = document.getElementById("leaves");
      const ctx = cv.getContext("2d");
      let w, h;
      const leaves = Array.from({ length: 28 }, () => ({
        x: Math.random(), y: Math.random(),
        s: 3 + Math.random() * 5,
        v: 0.25 + Math.random() * 0.5,
        p: Math.random() * 6.28,
        r: Math.random() * 6.28
      }));
      function resize() { w = cv.width = innerWidth; h = cv.height = innerHeight; }
      addEventListener("resize", resize);
      resize();
      (function frame() {
        ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = "rgba(250, 249, 245, 0.16)";
        for (const l of leaves) {
          l.y += l.v / h * 2;
          l.p += 0.01;
          l.r += 0.01;
          if (l.y > 1.05) { l.y = -0.05; l.x = Math.random(); }
          const x = l.x * w + Math.sin(l.p) * 30;
          ctx.save();
          ctx.translate(x, l.y * h);
          ctx.rotate(l.r);
          ctx.beginPath();
          ctx.ellipse(0, 0, l.s, l.s * 0.5, 0, 0, 6.28);
          ctx.fill();
          ctx.restore();
        }
        requestAnimationFrame(frame);
      })();
    }
  </script>
</body>
</html>
